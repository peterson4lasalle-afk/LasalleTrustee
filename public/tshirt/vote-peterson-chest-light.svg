<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <style>
      .font-sans-heavy { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .font-sans-bold { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .font-sans-med { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <g transform="translate(0, 20)">
    <!-- Top Pill Badge: VOTE -->
    <g transform="translate(470, 45)">
      <rect x="0" y="0" width="260" height="62" rx="31" fill="#005961" />
      <text x="130" y="42" text-anchor="middle" fill="#ffffff" class="font-sans-heavy" font-size="28" letter-spacing="6">★ VOTE ★</text>
    </g>

    <!-- Main Candidate Name: PETERSON -->
    <text x="600" y="245" text-anchor="middle" fill="#00262b" class="font-sans-heavy" font-size="146" letter-spacing="4">PETERSON</text>

    <!-- Accent Divider Bar with Stars -->
    <g transform="translate(150, 288)">
      <!-- Left Line -->
      <line x1="40" y1="0" x2="380" y2="0" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
      <!-- Center Stars -->
      <g transform="translate(450, 0)">
        <text x="-45" y="8" text-anchor="middle" fill="#d97706" font-size="28">★</text>
        <text x="0" y="11" text-anchor="middle" fill="#d97706" font-size="38">★</text>
        <text x="45" y="8" text-anchor="middle" fill="#d97706" font-size="28">★</text>
      </g>
      <!-- Right Line -->
      <line x1="520" y1="0" x2="860" y2="0" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- Office Title: FOR GECDSB TRUSTEE -->
    <text x="600" y="380" text-anchor="middle" fill="#d97706" class="font-sans-heavy" font-size="56" letter-spacing="8">FOR GECDSB TRUSTEE</text>
  </g>
</svg>