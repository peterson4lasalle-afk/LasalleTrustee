<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans-heavy { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .font-sans-bold { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    </style>
    <path id="text-path-top" d="M 170,400 A 230,230 0 0,1 630,400" />
    <path id="text-path-bottom" d="M 640,400 A 240,240 0 0,1 160,400" />
  </defs>

  <g transform="translate(400, 400)">
    <!-- Outer Decorative Ring -->
    <circle r="375" fill="none" stroke="#fbbf24" stroke-width="8" />
    <circle r="355" fill="#001e22" stroke="#005961" stroke-width="24" />
    <circle r="275" fill="none" stroke="#fbbf24" stroke-width="5" />
    <circle r="260" fill="#001417" />

    <!-- Arched Text Top: VOTE ADAM PETERSON -->
    <text fill="#ffffff" class="font-sans-heavy" font-size="34" letter-spacing="8">
      <textPath href="#text-path-top" startOffset="50%" text-anchor="middle">
        ★ VOTE ADAM PETERSON ★
      </textPath>
    </text>

    <!-- Arched Text Bottom: GECDSB TRUSTEE -->
    <text fill="#fbbf24" class="font-sans-heavy" font-size="32" letter-spacing="7">
      <textPath href="#text-path-bottom" startOffset="50%" text-anchor="middle">
        GECDSB TRUSTEE • 2026
      </textPath>
    </text>

    <!-- Center Icon: Star -->
    <g transform="translate(0, -110)">
      <polygon points="0,-35 11,-12 35,-12 16,3 23,26 0,12 -23,26 -16,3 -35,-12 -11,-12" fill="#fbbf24" />
    </g>

    <!-- Inner Core: PETERSON -->
    <g transform="translate(0, -10)">
      <text x="0" y="0" text-anchor="middle" fill="#ffffff" class="font-sans-heavy" font-size="74" letter-spacing="4">PETERSON</text>
      
      <!-- Divider bar -->
      <line x1="-160" y1="22" x2="160" y2="22" stroke="#fbbf24" stroke-width="4" />

      <!-- Office & Town -->
      <text x="0" y="52" text-anchor="middle" fill="#2dd4bf" class="font-sans-bold" font-size="22" letter-spacing="5">PUBLIC SCHOOL TRUSTEE</text>
      <text x="0" y="84" text-anchor="middle" fill="#cbd5e1" class="font-sans-bold" font-size="18" letter-spacing="3">LASALLE &amp; AMHERSTBURG</text>
      <text x="0" y="118" text-anchor="middle" fill="#fbbf24" class="font-sans-heavy" font-size="15" letter-spacing="2">“PUTTING STUDENTS FIRST”</text>
    </g>
  </g>
</svg>