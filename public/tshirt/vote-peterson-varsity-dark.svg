<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      .font-sans-heavy { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .font-sans-bold { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <g transform="translate(500, 70)">
    <!-- Top banner -->
    <text x="0" y="50" text-anchor="middle" fill="#fbbf24" class="font-sans-heavy" font-size="32" letter-spacing="8">LET’S PUT STUDENTS FIRST</text>
    
    <!-- Big VOTE -->
    <text x="0" y="140" text-anchor="middle" fill="#2dd4bf" class="font-sans-heavy" font-size="76" letter-spacing="12">VOTE</text>

    <!-- Massive PETERSON -->
    <text x="0" y="275" text-anchor="middle" fill="#ffffff" class="font-sans-heavy" font-size="138" letter-spacing="4">PETERSON</text>

    <!-- Underline bar -->
    <rect x="-380" y="305" width="760" height="8" rx="4" fill="#fbbf24" />

    <!-- FOR GECDSB TRUSTEE -->
    <text x="0" y="380" text-anchor="middle" fill="#ffffff" class="font-sans-heavy" font-size="46" letter-spacing="6">FOR GECDSB TRUSTEE</text>

    <!-- LASALLE & AMHERSTBURG -->
    <text x="0" y="435" text-anchor="middle" fill="#e2e8f0" class="font-sans-bold" font-size="28" letter-spacing="6">LASALLE &amp; AMHERSTBURG</text>
  </g>
</svg>